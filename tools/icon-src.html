<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#175B33"/>
      <stop offset="0.55" stop-color="#23713C"/>
      <stop offset="1" stop-color="#3F8A2E"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#A8CF46"/>
      <stop offset="1" stop-color="#4E8F26"/>
    </linearGradient>
    <linearGradient id="page" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF7E9"/>
    </linearGradient>
    <linearGradient id="lf" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#8FBE33"/>
      <stop offset="1" stop-color="#EEF59A"/>
    </linearGradient>
    <clipPath id="bookClip">
      <rect x="136" y="170" width="240" height="276" rx="24"/>
    </clipPath>
    <filter id="bshadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#082615" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- 圆角底 -->
  <rect x="18" y="18" width="476" height="476" rx="118" fill="url(#bg)"/>

  <!-- 新叶：从书上缘长出来。做大做饱和，否则缩到 16px 就化了 -->
  <path d="M286 200 C272 132 300 66 372 34 C384 106 350 182 286 200 Z"
        fill="url(#lf)" stroke="#0E4526" stroke-opacity="0.30" stroke-width="5" stroke-linejoin="round"/>
  <path d="M296 188 C314 144 336 96 358 48" stroke="#12522C" stroke-opacity="0.30" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- 书。深色描边是关键：没有它，绿书脊会和绿底糊成一坨 -->
  <g filter="url(#bshadow)">
    <rect x="136" y="170" width="240" height="276" rx="24" fill="url(#page)"
          stroke="#0E4526" stroke-opacity="0.55" stroke-width="6"/>
    <g clip-path="url(#bookClip)">
      <!-- 书脊 -->
      <rect x="136" y="170" width="58" height="276" fill="url(#spine)"/>
      <rect x="192" y="170" width="5" height="276" fill="#0E4526" opacity="0.28"/>
      <!-- 书脊压印 -->
      <rect x="149" y="214" width="30" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>
      <rect x="149" y="234" width="30" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>
      <rect x="149" y="386" width="30" height="6" rx="3" fill="#FFFFFF" opacity="0.45"/>
      <!-- 书页上的字迹 -->
      <rect x="216" y="262" width="132" height="11" rx="5.5" fill="#5E7A50" opacity="0.5"/>
      <rect x="216" y="308" width="100" height="11" rx="5.5" fill="#5E7A50" opacity="0.5"/>
      <rect x="216" y="354" width="118" height="11" rx="5.5" fill="#5E7A50" opacity="0.5"/>
    </g>
  </g>
</svg>
</body>
</html>
